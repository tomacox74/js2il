name: Test262 publication reconciliation
on:
  workflow_run:
    workflows: ['Test262 central catalogue']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply existing publication state/check updates (otherwise inspect only)
        type: boolean
        default: false
      pr_number:
        description: Optional exact existing publication PR number
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
  checks: read
concurrency:
  group: test262-publication-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      vars.TEST262_CATALOGUE_AUTHORITY == 'supabase' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'master'))
    environment: test262-catalogue
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Reviewed master only. No fixtures, artifact downloads, pushes or new PRs.
      - uses: actions/checkout@v5
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/test262/central/requirements.txt
      - name: Inspect or reconcile existing publications
        env:
          TEST262_DATABASE_URL: ${{ secrets.TEST262_COORDINATOR_DATABASE_URL }}
          TEST262_AUTHORITY_EPOCH: ${{ vars.TEST262_AUTHORITY_EPOCH }}
          TEST262_REPOSITORY_ID: ${{ vars.TEST262_REPOSITORY_ID }}
          TEST262_PRODUCER_ID: ${{ vars.TEST262_COORDINATOR_PRODUCER_ID }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_NAME: ${{ github.repository }}
          APPLY: ${{ github.event_name == 'workflow_run' || inputs.apply }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          mkdir -p artifacts/test262
          ARGS=()
          if [ "$APPLY" = true ]; then ARGS+=(--apply); fi
          if [ -n "$PR_NUMBER" ]; then ARGS+=(--pr-number "$PR_NUMBER"); fi
          python -m scripts.test262.central.cli reconcile-publications \
            --repository-name "$REPOSITORY_NAME" --limit 100 "${ARGS[@]}" \
            > artifacts/test262/publication-reconciliation.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test262-publication-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test262/publication-reconciliation.json
          if-no-files-found: warn
          retention-days: 90
