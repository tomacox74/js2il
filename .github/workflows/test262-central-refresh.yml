name: Test262 central registration refresh
on:
  workflow_run:
    workflows: ['test262 MVP']
    types: [completed]
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  target:
    if: >-
      vars.TEST262_CATALOGUE_AUTHORITY == 'supabase' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.target.outputs.revision }}
    steps:
      - uses: actions/github-script@v8
        id: target
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'master'});
            const revision = data.commit.sha;
            if (context.eventName === 'workflow_run' && context.payload.workflow_run.head_sha !== revision) {
              core.notice('A newer master revision superseded this validation.');
              return;
            }
            core.setOutput('revision', revision);
  refresh:
    needs: target
    if: needs.target.outputs.revision != ''
    # Shared with manual native preparation: only one reporting-target writer.
    concurrency:
      group: test262-central-native-target
      cancel-in-progress: false
    environment: test262-catalogue
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/test262/central/requirements.txt
      - name: Build trusted provenance and load pinned inventory
        run: |
          dotnet build scripts/test262/NativeScreeningHost/NativeScreeningHost.csproj -c Release --nologo
          ROOT="$(node scripts/test262/bootstrap.js --print-root)"
          git -C "$ROOT" sparse-checkout add /test/
          echo "TEST262_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Refresh exact validated master registration and reporting target
        env:
          TEST262_DATABASE_URL: ${{ secrets.TEST262_COORDINATOR_DATABASE_URL }}
          TEST262_AUTHORITY_EPOCH: ${{ vars.TEST262_AUTHORITY_EPOCH }}
          TEST262_REPOSITORY_ID: ${{ vars.TEST262_REPOSITORY_ID }}
          TEST262_PRODUCER_ID: ${{ vars.TEST262_COORDINATOR_PRODUCER_ID }}
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.target.outputs.revision }}
          TEST262_PROGRESS: '1'
          TEST262_DIAGNOSTIC_FILE: artifacts/test262/refresh-diagnostic.json
        run: |
          python -m scripts.test262.central.cli refresh --revision "$REVISION" \
            --root "$TEST262_ROOT" --output artifacts/test262/refresh-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test262-central-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test262/refresh-*.json
          if-no-files-found: warn
          retention-days: 90
