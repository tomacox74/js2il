name: Test262 authorized bounded recovery drill
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Fixed owner authorization for the one two-variant campaign
        type: string
        required: true
      phase:
        description: Verify a frozen baseline, then exhaust and recover its missing variant
        type: choice
        options: [verify, exhaust, recover]
        required: true
      baseline_run_id:
        description: Exact successful zero-execution baseline run, required for both live phases
        type: string
        default: ''
      previous_run_id:
        description: Exact successful exhaustion run, only for recovery
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  drill:
    if: ${{ github.ref == 'refs/heads/master' && inputs.authorization == 'live-recovery-2340-two-variants-20261027' && github.run_attempt == 1 }}
    concurrency:
      group: test262-central-native-target
      cancel-in-progress: false
    environment: test262-catalogue
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.403
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/test262/central/requirements.txt
      - name: Build trusted binaries and pinned inventory
        run: |
          dotnet build src/Cli/Jroc.csproj -c Release --nologo
          dotnet build scripts/test262/NativeScreeningHost/NativeScreeningHost.csproj -c Release --nologo
          ROOT="$(node scripts/test262/bootstrap.js --print-root)"
          git -C "$ROOT" sparse-checkout add /test/
          echo "TEST262_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Build and save the baseline fixture image once
        if: inputs.phase == 'verify'
        run: |
          docker build --pull --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -t test262-fixture:recovery-drill -f scripts/test262/central/fixture.Dockerfile .
          mkdir -p artifacts/test262
          docker image save test262-fixture:recovery-drill | gzip -n > artifacts/test262/fixture-image.tar.gz
      - name: Download the frozen baseline image without catalogue credentials
        if: inputs.phase != 'verify'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.baseline_run_id }}
          name: test262-recovery-image-${{ inputs.baseline_run_id }}-1
          path: artifacts/test262
      - name: Authenticate the baseline archive before loading its image
        if: inputs.phase != 'verify'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST262_REPOSITORY_ID: ${{ vars.TEST262_REPOSITORY_ID }}
          TEST262_PRODUCER_ID: ${{ vars.TEST262_COORDINATOR_PRODUCER_ID }}
          AUTHORIZATION: ${{ inputs.authorization }}
          PHASE: ${{ inputs.phase }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          TEST262_DIAGNOSTIC_FILE: artifacts/test262/recovery-drill/image-diagnostic.json
        run: |
          PREVIOUS_ARGS=()
          if [ -n "$PREVIOUS_RUN_ID" ]; then
            PREVIOUS_ARGS+=(--previous-run-id "$PREVIOUS_RUN_ID")
          fi
          python -m scripts.test262.central.live_recovery_drill \
            --authorization "$AUTHORIZATION" --phase "$PHASE" --root "$TEST262_ROOT" \
            --baseline-run-id "$BASELINE_RUN_ID" --restore-image-only \
            --image-archive artifacts/test262/fixture-image.tar.gz \
            --output artifacts/test262/recovery-drill/image-check.json "${PREVIOUS_ARGS[@]}"
      - name: Verify the read-only baseline or execute the one authorized phase
        env:
          TEST262_DATABASE_URL: ${{ secrets.TEST262_COORDINATOR_DATABASE_URL }}
          TEST262_AUTHORITY_EPOCH: ${{ vars.TEST262_AUTHORITY_EPOCH }}
          TEST262_REPOSITORY_ID: ${{ vars.TEST262_REPOSITORY_ID }}
          TEST262_PRODUCER_ID: ${{ vars.TEST262_COORDINATOR_PRODUCER_ID }}
          GH_TOKEN: ${{ github.token }}
          AUTHORIZATION: ${{ inputs.authorization }}
          PHASE: ${{ inputs.phase }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          TEST262_PROGRESS: '1'
          TEST262_DIAGNOSTIC_FILE: artifacts/test262/recovery-drill/diagnostic.json
        run: |
          PREVIOUS_ARGS=()
          BASELINE_ARGS=()
          if [ -n "$PREVIOUS_RUN_ID" ]; then
            PREVIOUS_ARGS+=(--previous-run-id "$PREVIOUS_RUN_ID")
          fi
          if [ -n "$BASELINE_RUN_ID" ]; then
            BASELINE_ARGS+=(--baseline-run-id "$BASELINE_RUN_ID")
          fi
          python -m scripts.test262.central.live_recovery_drill \
            --authorization "$AUTHORIZATION" --phase "$PHASE" --root "$TEST262_ROOT" \
            --image-archive artifacts/test262/fixture-image.tar.gz \
            --output artifacts/test262/recovery-drill/report.json \
            "${PREVIOUS_ARGS[@]}" "${BASELINE_ARGS[@]}"
      - name: Retain the verified image for the two bounded live phases
        if: success() && inputs.phase == 'verify'
        uses: actions/upload-artifact@v7
        with:
          name: test262-recovery-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test262/fixture-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve bounded proof and uncertain outcomes without replay
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-recovery-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test262/recovery-drill
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
