name: Publish coordinated packages
run-name: ${{ github.workflow }} - ${{ github.event_name }} - ${{ github.event.inputs.ref || github.event.release.tag_name || github.head_ref || github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to publish (for example v0.9.17)'
        required: false
        default: ''

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        env:
          REQUESTED_REF: ${{ github.event.inputs.ref || github.ref }}
        run: |
          tag="${REQUESTED_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a release tag such as v0.9.17, got '$REQUESTED_REF'." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Freeze release source commit
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate-release:
    needs: resolve-release
    permissions:
      contents: read
    uses: ./.github/workflows/release-validation.yml
    with:
      ref: ${{ needs.resolve-release.outputs.commit }}

  build-and-publish:
    needs: [resolve-release, validate-release]
    runs-on: windows-2025
    permissions:
      id-token: write
      contents: read
    env:
      NUGET_SERVER: https://api.nuget.org/v3/index.json
      VERSION: ${{ needs.resolve-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true

      - name: Install npm dependencies
        run: npm ci

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore jroc.sln

      - name: Build
        run: dotnet build jroc.sln -c Release --no-restore

      - name: Validate coordinated release package set
        run: npm run release:validate

      - name: Pack coordinated packages
        shell: pwsh
        run: |
          if (Test-Path out) {
            Remove-Item out -Recurse -Force
          }

          $projects = @(
            'src/JavaScriptRuntime/JavaScriptRuntime.csproj',
            'src/Cli/Jroc.csproj',
            'src/Jroc.Core/Jroc.Core.csproj',
            'src/Jroc.SDK/Jroc.SDK.csproj'
          )

          foreach ($project in $projects) {
            dotnet pack $project -c Release -o out -p:ContinuousIntegrationBuild=true -p:Version=${{ env.VERSION }}
          }

      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish coordinated packages to NuGet
        shell: pwsh
        run: |
          $packageNames = @(
            "Jroc.Runtime.$env:VERSION.nupkg",
            "jroc.$env:VERSION.nupkg",
            "Jroc.Core.$env:VERSION.nupkg",
            "Jroc.SDK.$env:VERSION.nupkg"
          )

          foreach ($packageName in $packageNames) {
            $pkgPath = Join-Path 'out' $packageName
            if (-not (Test-Path $pkgPath)) {
              Write-Error "Expected package not found: $pkgPath"
              exit 1
            }

            Write-Host "Pushing $packageName to $env:NUGET_SERVER"
            dotnet nuget push --source "$env:NUGET_SERVER" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" "$pkgPath" --skip-duplicate
          }
