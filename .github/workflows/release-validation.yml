name: Release Validation
run-name: ${{ github.workflow }} - ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Coordinated candidate version (empty creates a unique trial version)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Exact source commit to validate"
        type: string
        required: false
        default: ""
      package_version:
        description: "Coordinated release version to validate"
        type: string
        required: false
        default: ""
    outputs:
      artifact_id:
        description: "Exact SDK 11-built candidate that passed compatibility validation"
        value: ${{ jobs.candidate.outputs.artifact_id }}
      package_version:
        description: "Validated coordinated candidate version"
        value: ${{ jobs.candidate.outputs.package_version }}
  pull_request:
    branches: [ "master" ]
    paths:
      - ".github/workflows/dotnet.yml"
      - ".github/workflows/release-validation.yml"
      - ".github/workflows/publish-tool.yml"
      - "scripts/ci/**"

permissions:
  contents: read

jobs:
  candidate:
    name: SDK 11 release candidate compatibility
    uses: ./.github/workflows/sdk11-package-validation.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      package_version: ${{ inputs.package_version || '' }}

  tests:
    name: Cross-platform CI suite
    uses: ./.github/workflows/dotnet.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      runners: '["windows-2025","macos-15"]'

  validate:
    name: Validate release package set (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Select the release SDK explicitly
        shell: bash
        run: bash scripts/ci/selectReleaseSdk.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true

      - name: Restore dependencies
        run: |
          dotnet restore
          npm ci

      - name: Validate release workflow invariants
        if: github.event_name == 'pull_request'
        run: node --test scripts/ci/release-workflows.test.js

      - name: Validate coordinated release package set
        run: npm run release:validate
