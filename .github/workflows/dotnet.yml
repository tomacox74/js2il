# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET
run-name: ${{ github.workflow }} - ${{ github.event_name }} - ${{ github.event.release.tag_name || github.event.inputs.branch || github.head_ref || github.ref_name }}

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - "CHANGELOG.md"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            project: tests/Jroc.Tests/Jroc.Tests.csproj
            filter: "Category!=ReleaseOnly&FullyQualifiedName!~JrocSdkPackageTests"
          - name: test262
            project: tests/Jroc.Test262.Tests/Jroc.Test262.Tests.csproj
            filter: "Category!=ReleaseOnly"
          - name: sdk-packaging-metadata
            project: tests/Jroc.Tests/Jroc.Tests.csproj
            filter: "Category!=ReleaseOnly&FullyQualifiedName~JrocSdkPackageTests&CiShard=metadata"
          - name: sdk-packaging-build
            project: tests/Jroc.Tests/Jroc.Tests.csproj
            filter: "Category!=ReleaseOnly&FullyQualifiedName~JrocSdkPackageTests&CiShard=build"
          - name: sdk-packaging-runtime
            project: tests/Jroc.Tests/Jroc.Tests.csproj
            filter: "Category!=ReleaseOnly&FullyQualifiedName~JrocSdkPackageTests&CiShard=runtime"
          - name: sdk-packaging-samples
            project: tests/Jroc.Tests/Jroc.Tests.csproj
            filter: "Category!=ReleaseOnly&FullyQualifiedName~JrocSdkPackageTests&CiShard=samples"
          - name: sdk-packaging-npm-samples
            project: tests/Jroc.Tests/Jroc.Tests.csproj
            filter: "Category!=ReleaseOnly&FullyQualifiedName~JrocSdkPackageTests&CiShard=npm-samples"
    name: test (${{ matrix.name }})
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore .NET tools
      run: dotnet tool restore 
    - name: Restore dependencies
      run: dotnet restore ${{ matrix.project }}
    - name: Build
      run: dotnet build ${{ matrix.project }} --no-restore
    - name: Verify SDK packaging shard coverage
      if: matrix.name == 'sdk-packaging-metadata'
      shell: bash
      run: |
        dotnet test ${{ matrix.project }} --no-build --list-tests \
          --filter "Category!=ReleaseOnly&FullyQualifiedName~JrocSdkPackageTests" \
          | sed -n 's/^    \(Jroc\.Tests\.JrocSdkPackageTests\..*\)$/\1/p' \
          | sort > /tmp/all-sdk-package-tests.txt
        : > /tmp/sharded-sdk-package-tests.txt
        for shard in metadata build runtime samples npm-samples; do
          shard_file="/tmp/sdk-package-tests-$shard.txt"
          dotnet test ${{ matrix.project }} --no-build --list-tests \
            --filter "Category!=ReleaseOnly&FullyQualifiedName~JrocSdkPackageTests&CiShard=$shard" \
            | sed -n 's/^    \(Jroc\.Tests\.JrocSdkPackageTests\..*\)$/\1/p' \
            > "$shard_file"
          test -s "$shard_file"
          cat "$shard_file" >> /tmp/sharded-sdk-package-tests.txt
        done
        sort -o /tmp/sharded-sdk-package-tests.txt /tmp/sharded-sdk-package-tests.txt
        diff -u /tmp/all-sdk-package-tests.txt /tmp/sharded-sdk-package-tests.txt
    - name: Test
      run: dotnet test ${{ matrix.project }} --no-build --verbosity minimal --filter "${{ matrix.filter }}"
    - name: Upload received snapshots
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: verify-received-snapshots-${{ matrix.name }}
        path: |
          **/*.received.txt
        if-no-files-found: ignore

  # Aggregate gate so branch protection can keep requiring a single "build" check.
  build:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
    - name: Verify test matrix results
      run: |
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "Test matrix result: ${{ needs.test.result }}"
          exit 1
        fi
