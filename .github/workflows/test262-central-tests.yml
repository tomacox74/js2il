name: Test262 central catalogue invariants
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/test262/**', 'supabase/**', 'tests/test262/central/**', '.github/workflows/test262-*.yml', 'package.json', 'package-lock.json']
  push:
    branches: [master]
    paths: ['scripts/test262/**', 'supabase/**', 'tests/test262/central/**', '.github/workflows/test262-*.yml', 'package.json', 'package-lock.json']
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: catalogue_tests
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/test262/central/requirements.txt
      - run: python -m unittest discover -s tests/test262/central -p 'test_*.py' -v
        env:
          TEST262_TEST_DSN: postgresql://postgres:disposable-test-password@localhost:5432/catalogue_tests
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: node --test scripts/test262/catalog.test.js scripts/test262/specificationMetadata.test.js scripts/test262/nativePorting.test.js scripts/test262/nativeScreeningHost.test.js scripts/test262/compilationCoverage.test.js
