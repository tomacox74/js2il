name: Test262 cutover evidence preservation
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preserve reviewed evidence/recovery ZIPs, verify an exact version, or discover metadata
        type: choice
        options:
          - preserve
          - preserve-recovery
          - verify-retained
          - discover-retained
        default: preserve
      artifact_id:
        description: Existing retained artifact ID for verify-retained (no upload or import)
        type: string
        default: '11522307991'
      evidence_manifest:
        description: Reviewed repository manifest defining the complete required artifact set
        type: string
        default: scripts/test262/central/cutover-evidence.json
      recovery_authorization:
        description: For owner-authorized recovery uploads only, enter preserve-33-recovery-archives
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: test262-cutover-evidence-preservation
  cancel-in-progress: false
jobs:
  preserve:
    if: github.ref == 'refs/heads/master'
    environment: test262-catalogue-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - name: Validate reviewed operation
        env:
          OPERATION: ${{ inputs.operation }}
          RECOVERY_AUTHORIZATION: ${{ inputs.recovery_authorization }}
        run: |
          case "$OPERATION" in
            preserve|verify-retained|discover-retained) ;;
            preserve-recovery)
              if [ "$RECOVERY_AUTHORIZATION" != "preserve-33-recovery-archives" ]; then
                echo "::error::Explicit authorization for the 33 recovery archives is required"; exit 1
              fi
              ;;
            *) echo "::error::Unsupported evidence operation"; exit 1 ;;
          esac
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TEST262_BACKUP_AWS_ROLE }}
          aws-region: ${{ vars.TEST262_BACKUP_AWS_REGION }}
          inline-session-policy: >-
            ${{ inputs.operation == 'discover-retained' &&
            '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucketVersions","s3:GetObjectVersion","s3:GetObjectRetention"],"Resource":"*"}]}' ||
            inputs.operation == 'preserve-recovery' &&
            '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketVersioning","s3:GetBucketObjectLockConfiguration","s3:PutObject","s3:GetObjectVersion","s3:GetObjectRetention","kms:GenerateDataKey","kms:Decrypt"],"Resource":"*"}]}' ||
            inputs.operation == 'verify-retained' &&
            '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketVersioning","s3:GetBucketObjectLockConfiguration","s3:GetObjectVersion","s3:GetObjectRetention","kms:Decrypt"],"Resource":"*"}]}' || '' }}
      - name: Verify reports/outboxes and retain original evidence in encrypted S3
        if: inputs.operation == 'preserve'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST262_BACKUP_S3_URI: ${{ vars.TEST262_BACKUP_S3_URI }}
          TEST262_BACKUP_KMS_KEY: ${{ vars.TEST262_BACKUP_KMS_KEY }}
          EVIDENCE_OUTPUT: /tmp/test262-cutover-report
          EVIDENCE_MANIFEST: ${{ inputs.evidence_manifest }}
        run: python -m scripts.test262.central.cutover_evidence --manifest "$EVIDENCE_MANIFEST"
      - name: Preserve the 33 original recovery ZIPs without imports or policy changes
        if: inputs.operation == 'preserve-recovery'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST262_BACKUP_S3_URI: ${{ vars.TEST262_BACKUP_S3_URI }}
          TEST262_BACKUP_KMS_KEY: ${{ vars.TEST262_BACKUP_KMS_KEY }}
          RECOVERY_AUTHORIZATION: ${{ inputs.recovery_authorization }}
        run: |
          python -m scripts.test262.central.recovery_preservation \
            --authorization "$RECOVERY_AUTHORIZATION" \
            --output /tmp/test262-cutover-report/recovery-preservation-report.json
      - name: Read back one existing retained archive without writes
        if: inputs.operation == 'verify-retained'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST262_BACKUP_S3_URI: ${{ vars.TEST262_BACKUP_S3_URI }}
          TEST262_BACKUP_KMS_KEY: ${{ vars.TEST262_BACKUP_KMS_KEY }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          python -m scripts.test262.central.retained_evidence \
            --artifact-id "$ARTIFACT_ID" --output /tmp/test262-cutover-report/retained-verification-report.json
      - name: Discover unmatched retained archive candidates without payload reads or writes
        if: inputs.operation == 'discover-retained'
        env:
          TEST262_BACKUP_S3_URI: ${{ vars.TEST262_BACKUP_S3_URI }}
          TEST262_BACKUP_KMS_KEY: ${{ vars.TEST262_BACKUP_KMS_KEY }}
        run: |
          python -m scripts.test262.central.retained_discovery \
            --output /tmp/test262-cutover-report/retained-discovery-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test262-cutover-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/test262-cutover-report/*report.json
          retention-days: 90
          if-no-files-found: warn
      - name: Remove local report copy
        if: always()
        run: rm -rf /tmp/test262-cutover-report
