name: Test262 cutover evidence preservation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: test262-cutover-evidence-preservation
  cancel-in-progress: false
jobs:
  preserve:
    if: github.ref == 'refs/heads/master'
    environment: test262-catalogue-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.TEST262_BACKUP_AWS_ROLE }}
          aws-region: ${{ vars.TEST262_BACKUP_AWS_REGION }}
      - name: Verify reports/outboxes and retain original evidence in encrypted S3
        env:
          GH_TOKEN: ${{ github.token }}
          TEST262_BACKUP_S3_URI: ${{ vars.TEST262_BACKUP_S3_URI }}
          TEST262_BACKUP_KMS_KEY: ${{ vars.TEST262_BACKUP_KMS_KEY }}
          EVIDENCE_OUTPUT: /tmp/test262-cutover-report
        run: python -m scripts.test262.central.cutover_evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test262-cutover-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/test262-cutover-report/evidence-report.json
          retention-days: 90
          if-no-files-found: warn
      - name: Remove local report copy
        if: always()
        run: rm -rf /tmp/test262-cutover-report
