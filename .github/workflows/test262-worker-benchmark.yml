name: Test262 worker benchmark
on:
  workflow_dispatch:
    inputs:
      linux_rate_usd:
        description: Optional USD rate per billed Linux minute for screening estimates
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/workflows/test262-worker-benchmark.yml'
      - 'scripts/test262/central/worker_benchmark.py'

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        kind: [mvp-composite, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-pilot-only
          POSTGRES_DB: catalogue_pilot
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r scripts/test262/central/requirements.txt
      - name: Build the runtime and isolate fixture execution
        run: |
          dotnet build src/Cli/Jroc.csproj -c Release --nologo
          dotnet build scripts/test262/NativeScreeningHost/NativeScreeningHost.csproj -c Release --nologo
          docker build --pull -t test262-fixture:pilot -f scripts/test262/central/fixture.Dockerfile .
          ROOT="$(node scripts/test262/bootstrap.js --print-root)"
          git -C "$ROOT" sparse-checkout add /test/
          echo "TEST262_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Benchmark 1, 2 and 4 workers on a disposable catalogue
        env:
          TEST262_PILOT_ADMIN_DSN: postgresql://postgres:disposable-pilot-only@127.0.0.1:5432/catalogue_pilot
          BENCHMARK_KIND: ${{ matrix.kind }}
          LINUX_RATE_USD: ${{ inputs.linux_rate_usd }}
        run: |
          args=()
          if [ -n "$LINUX_RATE_USD" ]; then args+=(--rate "$LINUX_RATE_USD"); fi
          python -m scripts.test262.central.worker_benchmark --kind "$BENCHMARK_KIND" \
            --root "$TEST262_ROOT" --output artifacts/test262/worker-benchmark "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test262-worker-benchmark-${{ matrix.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/test262/worker-benchmark/benchmark.json
            artifacts/test262/worker-benchmark/throughput.svg
          if-no-files-found: warn
          retention-days: 90
